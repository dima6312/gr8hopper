services:
  gr8hopper:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    container_name: gr8hopper
    ports:
      - "3000:3000"
    environment:
      # Required for security - set these in your shell or a .env file
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Point to the persistent data volume
      - CONFIG_FILE=/app/data/routes.json
      # Optional settings
      - ADMIN_PATH=${ADMIN_PATH:-admin}
      - PORT=3000
    volumes:
      # Mount a 'data' directory for persistence.
      # Docker will create this folder locally if it's missing.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
