version: '3.8'

# IMPORTANT: Set ADMIN_PASSWORD before running:
#   export ADMIN_PASSWORD=your-secure-password
#   docker compose up -d

services:
  gr8hopper:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required - set it before running}
    volumes:
      # Mount routes.json for persistence
      - ./data/routes.json:/app/routes.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
