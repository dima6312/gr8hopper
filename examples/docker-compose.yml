services:
  gr8hopper:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    container_name: gr8hopper
    ports:
      - "3000:3000"
    environment:
      # Required for security - set these in your shell or a .env file
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Point to the persistent data volume
      - CONFIG_FILE=/app/data/routes.json
      # Optional settings
      - ADMIN_PATH=${ADMIN_PATH:-admin}
      - PORT=3000
    volumes:
      # Use a named volume for data persistence to avoid permission issues
      # with the non-root container user (gr8hopper:1001)
      - gr8hopper-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gr8hopper-data:
